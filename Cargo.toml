[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/app"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
asaf-core = { path = "crates/core" }
asaf-server = { path = "crates/server" }
asaf-projector = { path = "crates/projector" }
asaf-console = { path = "crates/console" }
asaf-library = { path = "crates/library" }
asaf-openlyrics = { path = "crates/openlyrics" }

# GPUI Kit (GPUI snapshot + gpui-component), pinned exactly: see README
# ("Why GPUI is pinned"). Aliased as `gpui` so GPUI's derive macros resolve.
gpui = { package = "gpui-kit", version = "=0.7.3" }
wry = "=0.57.0"
objc2 = "0.6"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3"
raw-window-handle = "0.6"

axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
